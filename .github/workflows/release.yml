name: release

# Fires when release-please tags a release (created by merging the Release PR
# that release-please opens on main). Builds and publishes the actual
# artifacts: GitHub Release assets (tar.gz/deb/rpm/checksums) and the
# Homebrew tap formula.
on:
  push:
    tags:
      - "v*"
  # Manual fallback, e.g. to finish a release whose tag push didn't trigger
  # this workflow (see release-please.yml's token comment).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
