[project]
name = "apl"
version = "0.1.0"
description = "AI Prompt Log viewer - tig-style TUI for Claude Code session logs"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.60.0",
]

[project.scripts]
apl = "apl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apl"]
